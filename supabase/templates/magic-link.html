<!doctype html>
<html lang="nb">
  <body
    style="
      margin: 0;
      padding: 32px;
      background: #fff9f2;
      color: #082f5a;
      font-family: Arial, sans-serif;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        padding: 28px;
        background: #ffffff;
        border: 1px solid #e8ded3;
        border-radius: 16px;
      "
    >
      <p style="margin: 0 0 24px; font-family: Georgia, serif; font-size: 28px; font-weight: 700">
        Mattis
      </p>
      <h1 style="margin: 0 0 12px; font-family: Georgia, serif; font-size: 32px">
        Din innloggingskode
      </h1>
      <p style="margin: 0 0 24px; color: #415e78">Skriv inn denne sekssifrede koden i Mattis:</p>
      <p style="margin: 0 0 24px; font-size: 36px; font-weight: 700; letter-spacing: 0.18em">
        {{ .Token }}
      </p>
      <p style="margin: 0; color: #637286; font-size: 14px">
        Hvis du ikke ba om koden, kan du se bort fra denne e-posten.
      </p>
    </div>
  </body>
</html>
